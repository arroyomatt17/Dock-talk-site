<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dock Talk — Riptide</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#0F3B3A;
  --sand:#FBEFD6;
  --sand-light:#FFF9EC;
  --sea:#0E9A9A;
  --sea-light:rgba(14,154,154,0.10);
  --forest:#2E8B57;
  --sunset:#F2683C;
  --sunset-light:rgba(242,104,60,0.11);
  --palm:#C9A227;
  --line:rgba(15,59,58,0.14);
  --line-soft:rgba(15,59,58,0.07);
  --muted:rgba(15,59,58,0.52);
  --radius:10px;
}
html,body{min-height:100%;background:var(--sand-light);color:var(--ink);font-family:'Source Sans 3',sans-serif;-webkit-font-smoothing:antialiased;}

.nav{position:sticky;top:0;z-index:100;background:rgba(255,249,236,0.95);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px 24px;}
.wordmark{font-family:'Fraunces',serif;font-weight:700;font-size:22px;letter-spacing:-0.3px;}
.wordmark em{font-style:italic;font-weight:500;color:var(--sunset);}
.nav-right{display:flex;align-items:center;gap:12px;}
.nav-back{font-size:13px;color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit;font-weight:600;display:none;}
.nav-back:hover{color:var(--ink);}
.nav-login{font-size:13px;color:var(--sea);background:none;border:1px solid var(--line);padding:7px 16px;
  border-radius:20px;cursor:pointer;font-family:inherit;font-weight:600;display:none;}
.nav-login:hover{background:var(--sea-light);}
.nav-login.nav-avatar{border-radius:50%;width:34px;height:34px;padding:0;line-height:32px;text-align:center;background:var(--sea);color:#fff;border:none;font-size:12px;}
.nav-login.nav-avatar:hover{background:var(--forest);}
.lang-select{font-size:12.5px;font-family:inherit;font-weight:600;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:20px;padding:7px 10px;cursor:pointer;outline:none;}

.screen{display:none;animation:fadeUp 0.22s ease;}
.screen.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.intro{max-width:640px;margin:0 auto;padding:52px 24px 80px;}
.intro-headline{font-family:'Fraunces',serif;font-weight:600;font-size:38px;line-height:1.1;letter-spacing:-0.5px;margin-bottom:14px;}
.intro-headline em{font-style:italic;font-weight:500;color:var(--sea);}
.intro-sub{font-size:15.5px;line-height:1.6;color:rgba(255,255,255,0.72);max-width:440px;margin-bottom:36px;}
.sample-cards{position:relative;height:150px;margin-bottom:40px;}
.sc{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;
  opacity:0;position:absolute;top:0;left:0;right:0;transform:translateY(6px);
  transition:opacity 0.6s ease, transform 0.6s ease;pointer-events:none;}
.sc.sc-active{opacity:0.45;transform:translateY(0);}
.sc-tag{display:inline-block;font-size:9px;text-transform:uppercase;letter-spacing:1px;background:var(--palm);color:#fff;padding:2px 8px;border-radius:3px;margin-bottom:8px;}
.sc-name{font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin-bottom:5px;}
.sc-text{font-family:'Caveat',cursive;font-size:20px;line-height:1.2;}
.sc-meta{font-size:10.5px;color:var(--muted);margin-top:7px;}
.cta-block{display:flex;flex-direction:column;}
.btn-enter{display:block;width:100%;padding:16px;text-align:center;font-family:inherit;font-weight:700;font-size:15px;
  border:none;border-radius:8px;cursor:pointer;transition:opacity 0.15s;}
.btn-enter-diner{background:var(--sunset);color:#fff;}
.btn-enter-diner:hover{opacity:0.88;}
.own-restaurant{text-align:center;padding:16px 0 0 0;font-size:12.5px;color:var(--muted);}
.own-restaurant button{background:none;border:none;color:var(--muted);font-size:12.5px;cursor:pointer;
  font-family:inherit;text-decoration:underline;text-underline-offset:3px;}
.own-restaurant button:hover{color:var(--ink);}

.inner{max-width:640px;margin:0 auto;padding:32px 24px 80px;}
h1,h2,h3,h4{font-family:'Fraunces',serif;}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--sea);font-weight:700;margin-bottom:8px;}
.page-title{font-size:26px;font-weight:600;margin-bottom:6px;}
.page-sub{font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.55;}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;font-weight:700;color:var(--sea);margin-bottom:7px;}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;border:1px solid var(--line);
  background:var(--sand-light);font-family:inherit;font-size:14.5px;border-radius:6px;color:var(--ink);outline:none;transition:border-color 0.15s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--sea);}
.field textarea{resize:vertical;min-height:72px;line-height:1.5;}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:58px;}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--sea);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;padding:6px 8px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.hint{font-size:12px;color:var(--muted);margin-top:6px;}

.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border:none;border-radius:6px;
  font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:opacity 0.15s;width:100%;}
.btn:disabled{opacity:0.5;cursor:default;}
.btn-sea{background:var(--sea);color:#fff;}
.btn-sea:hover:not(:disabled){opacity:0.88;}
.btn-sunset{background:var(--sunset);color:#fff;}
.btn-sunset:hover:not(:disabled){opacity:0.88;}
.btn-ghost{background:transparent;color:var(--sea);border:1px solid var(--line);width:auto;}
.btn-ghost:hover{background:var(--sea-light);}
.btn-sm{padding:7px 14px;font-size:12.5px;}
.status-msg{font-size:13px;text-align:center;min-height:18px;color:var(--sea);margin-top:10px;}
.status-msg.err{color:var(--sunset);}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.filter-btn{font-size:12.5px;padding:6px 14px;border:1px solid var(--line);border-radius:20px;background:#fff;
  cursor:pointer;font-family:inherit;font-weight:500;transition:all 0.12s;color:var(--ink);}
.filter-btn.active{background:var(--sea);color:#fff;border-color:var(--sea);}
.dash-tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.dash-tab-btn{font-size:13px;padding:10px 18px;border:1px solid var(--line);border-radius:20px;background:#fff;
  cursor:pointer;font-family:inherit;font-weight:700;transition:all 0.12s;color:var(--ink);}
.dash-tab-btn.active{background:var(--sea);color:#fff;border-color:var(--sea);}
.feed-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.feed-count{font-size:12.5px;color:var(--muted);}
.refresh-btn{font-size:12px;background:none;border:1px solid var(--line);padding:6px 12px;border-radius:20px;
  cursor:pointer;color:var(--sea);font-family:inherit;font-weight:600;}
.refresh-btn:hover{background:var(--sea-light);}

.feed-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:12px;}
.fc-tag{display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;background:var(--palm);
  color:#fff;padding:2px 8px;border-radius:3px;margin-bottom:10px;}
.fc-name-link{display:block;font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin-bottom:6px;
  color:var(--sea);background:none;border:none;padding:0;text-align:left;cursor:pointer;
  text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;}
.fc-name-link:hover{text-decoration-color:var(--sea);}
.fc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.fc-row .fc-name-link{flex:1;}
.fav-btn{background:none;border:none;font-size:20px;line-height:1;cursor:pointer;padding:2px 4px;color:var(--muted);flex-shrink:0;}
.fav-btn.active{color:var(--sunset);}
.fav-btn:hover{opacity:0.75;}
.fc-text{font-family:'Caveat',cursive;font-size:21px;line-height:1.25;margin-bottom:10px;}
.fc-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}
.empty-feed{text-align:center;padding:48px 20px;}
.ef-title{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin-bottom:8px;}
.ef-sub{font-size:14px;color:var(--muted);line-height:1.6;}

.icon-grid{display:flex;gap:20px;margin:22px 0;flex-wrap:wrap;}
.icon-btn{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-family:inherit;padding:0;}
.icon-circle{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:#fff;border:1px solid var(--line);font-size:20px;transition:border-color 0.15s, background 0.15s;}
.icon-btn.active .icon-circle{border-color:var(--sea);background:var(--sea-light);}
.icon-label{font-size:10.5px;font-weight:600;color:var(--ink);text-align:center;}
.detail-panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:14px;}
.dp-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--sea);font-weight:700;margin-bottom:10px;}
.dp-value{font-size:15px;line-height:1.6;}
.menu-category{margin-bottom:16px;}
.menu-category:last-child{margin-bottom:0;}
.menu-category h4{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--palm);font-weight:700;margin-bottom:8px;}
.menu-item{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px dotted var(--line-soft);color:rgba(255,255,255,0.85);}
.menu-item:last-child{border-bottom:none;}
.photo-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.photo-upload{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.photo-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:2px dashed var(--line);
  border-radius:12px;padding:11px 16px;cursor:pointer;font-family:inherit;font-size:13.5px;
  font-weight:600;color:var(--ink);transition:border-color .15s,background .15s;}
.photo-btn:hover{border-style:solid;background:var(--sea-light);}
.photo-btn-icon{font-size:17px;}
.thumb-wrap{position:relative;display:inline-block;}
.thumb-wrap img{width:84px;height:64px;object-fit:cover;border-radius:10px;border:2px solid var(--line);display:block;}
.thumb-x{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;
  background:var(--sunset);color:#fff;border:2px solid var(--line);cursor:pointer;
  font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0;}
.fc-photo{width:100%;max-height:190px;object-fit:cover;border-radius:12px;
  border:2px solid var(--line);margin:4px 0 12px 0;display:block;}
.pc-photo{width:100%;max-height:150px;object-fit:cover;border-radius:10px;
  border:2px solid var(--line);margin:8px 0;display:block;}
.photo-row img{width:130px;height:98px;object-fit:cover;border-radius:6px;border:1px solid var(--line);}
.scribble-frame{width:130px;height:98px;border-radius:6px;border:1px solid var(--line);overflow:hidden;}
.scribble-frame svg{display:block;width:100%;height:100%;}
.recurring-badge{display:inline-block;font-size:13px;background:var(--sunset-light);color:var(--sunset);
  padding:6px 14px;border-radius:20px;font-weight:600;margin-bottom:10px;}

.step{display:none;}.step.active{display:block;}
.code-inputs{display:flex;gap:10px;justify-content:center;margin:20px 0;}
.code-inputs input{width:48px;height:56px;text-align:center;font-size:22px;font-weight:700;border:1.5px solid var(--line);
  border-radius:6px;background:var(--sand-light);font-family:inherit;color:var(--ink);outline:none;}
.code-inputs input:focus{border-color:var(--sea);}
.pending-box{text-align:center;padding:32px 20px;}
.pending-icon{font-size:36px;margin-bottom:12px;}
.pending-box h3{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin-bottom:10px;}
.pending-box p{font-size:14px;color:var(--muted);line-height:1.6;max-width:340px;margin:0 auto;}

.dash-tag{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:1px;background:var(--forest);
  color:#fff;padding:3px 10px;border-radius:20px;margin-bottom:8px;}
.dash-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;}
.preview-label{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);font-weight:700;margin:20px 0 10px 0;}
.preview-card{background:var(--sand);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;}
.pc-tag{display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;background:var(--palm);color:#fff;padding:2px 8px;border-radius:3px;margin-bottom:10px;}
.pc-name{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin-bottom:6px;}
.pc-text{font-family:'Caveat',cursive;font-size:21px;line-height:1.25;margin-bottom:8px;}
.pc-meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;}
.posted-list{margin-top:24px;}
.posted-item{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line-soft);gap:12px;}
.posted-item:last-child{border-bottom:none;}
.pi-slot{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:4px;}
.pi-text{font-family:'Caveat',cursive;font-size:18px;line-height:1.2;}
.delete-btn{font-size:11px;color:var(--sunset);background:none;border:none;cursor:pointer;font-family:inherit;opacity:0.7;}
.delete-btn:hover{opacity:1;}

.r-signin{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;}
.r-wordmark{font-family:'Fraunces',serif;font-weight:700;font-size:28px;margin-bottom:6px;}
.r-wordmark em{font-style:italic;font-weight:500;color:var(--sea);}
.r-tagline{font-size:13px;color:var(--muted);margin-bottom:36px;}
.r-tagline .tagline-hl{font-family:'Space Grotesk',sans-serif;font-style:normal;font-weight:700;color:var(--sea);}
.r-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px;width:100%;max-width:400px;}
.r-card h2{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin-bottom:4px;}
.r-sub{font-size:13px;color:var(--muted);margin-bottom:22px;}

@media(max-width:560px){
  .intro-headline{font-size:28px;}
  .row2{grid-template-columns:1fr;}
  .nav{padding:12px 14px;}
  .lang-select{padding:6px 8px;font-size:12px;}
}

:root{
  --display:'Space Grotesk',sans-serif; --ink:#F2F2F2; --line:rgba(255,255,255,0.14);
  --sand:#151515; --sand-light:#0A0A0A;
  --sea:#C6FF3D; --sea-light:rgba(198,255,61,0.12);
  --forest:#C6FF3D; --sunset:#FF5C5C; --sunset-light:rgba(255,92,92,0.14);
  --palm:#C6FF3D; --accent:#C6FF3D;
  --line-soft:rgba(255,255,255,0.08); --muted:rgba(255,255,255,0.55); --radius:16px;
}
body{background:var(--sand-light);font-family:'Space Grotesk',sans-serif;color:var(--ink);}
h1,h2,h3,h4,.wordmark,.page-title,.intro-headline,.r-wordmark,.ef-title,.pc-name,.sc-name,.fc-name-link{font-family:'Space Grotesk',sans-serif !important;font-weight:700;}
.intro-headline{font-size:44px;}
.fc-text,.sc-text,.pc-text,.pi-text{font-family:'Space Grotesk',sans-serif;font-weight:400;font-size:15.5px;line-height:1.5;}
.fc-name-link{color:var(--ink);}

.nav{background:var(--sand-light);border-bottom:1px solid var(--line);}
.wordmark{font-weight:700;letter-spacing:-0.4px;text-transform:uppercase;}
.wordmark em{font-style:normal;color:var(--accent);}
.intro-headline{font-weight:700;letter-spacing:-1.2px;line-height:1.05;}
.intro-headline em{font-style:normal;color:var(--accent);}
.page-title{font-weight:700;letter-spacing:-0.6px;}
.eyebrow,.dp-label,.choose-label,.preview-label{font-family:var(--display);text-transform:uppercase;letter-spacing:0.5px;font-size:12px;font-weight:700;color:var(--accent);}
.field label{font-family:var(--display);text-transform:uppercase;letter-spacing:0.4px;font-size:12px;font-weight:700;color:var(--ink);}
.card,.feed-card,.detail-panel,.r-card,.preview-card,.sc{background:var(--sand);border:1px solid var(--line);border-radius:var(--radius);box-shadow:none;}
.field input,.field select,.field textarea,.code-inputs input{border:1px solid var(--line);border-radius:12px;background:var(--sand);color:var(--ink);font-weight:400;}
.btn,.btn-enter{border-radius:100px;border:none;font-family:var(--display);font-weight:700;box-shadow:none;transition:opacity .12s;}
.btn:hover:not(:disabled),.btn-enter:hover{transform:none;box-shadow:none;opacity:0.85;}
.btn-ghost{background:var(--sand);color:var(--ink);border:1px solid var(--line);}
.filter-btn{border:1px solid var(--line);border-radius:100px;font-weight:600;background:var(--sand);color:var(--ink);}
.fc-tag,.sc-tag,.pc-tag{text-transform:uppercase;letter-spacing:0.3px;font-size:10.5px;font-weight:700;border-radius:100px;padding:4px 12px;border:1px solid var(--accent);}
.fc-name-link{text-decoration:none;font-size:19px;letter-spacing:-0.4px;}
.fc-name-link:hover{color:var(--accent);}
.icon-circle{border:1px solid var(--line);background:var(--sand);box-shadow:none;}
.scribble-frame,.photo-row img{border:1px solid var(--line);border-radius:12px;}
.recurring-badge,.dash-tag{border:1px solid var(--accent);border-radius:100px;font-weight:600;background:transparent;color:var(--accent);}
.feed-card{background:var(--sand);}
.feed-card:nth-child(3n+2){background:var(--sand);}
.feed-card:nth-child(3n+3){background:var(--sand);}
.btn-enter-diner,.btn-sea{background:var(--accent);color:#0A0A0A;}
.btn-sunset{background:var(--accent);color:#0A0A0A;}
.filter-btn.active{background:var(--accent);color:#0A0A0A;border-color:var(--accent);}
.fc-tag,.sc-tag,.pc-tag{background:transparent;color:var(--accent);}
.icon-btn.active .icon-circle{background:var(--sea-light);border-color:var(--accent);}
.dash-tab-btn{background:var(--sand);color:var(--ink);}
.dash-tab-btn.active{color:#0A0A0A;}
.nav-login.nav-avatar{color:#0A0A0A;}
.lang-select{background:var(--sand);color:var(--ink);border:1px solid var(--line);}
.photo-btn{background:var(--sand);color:var(--ink);border:2px dashed var(--line);}

</style>
</head>
<body>

<div class="nav">
  <div class="wordmark">DOCK <em>TALK</em></div>
  <div class="nav-right">
    <button class="nav-back" id="navBack" onclick="window.history.back()">←</button>
    <button class="nav-login" id="navLogin" onclick="goScreen('screenGate')"></button>
    <select class="lang-select" id="langSelect" onchange="setLang(this.value)">
      <option value="en">🇬🇧 EN</option>
      <option value="es">🇪🇸 ES</option>
      <option value="fr">🇫🇷 FR</option>
      <option value="zh">🇨🇳 中文</option>
      <option value="de">🇩🇪 DE</option>
    </select>
  </div>
</div>

<!-- INTRO -->
<div class="screen active" id="screenIntro">
  <div class="intro">
    <div class="eyebrow" data-i18n="region"></div>
    <div class="intro-headline" data-i18n="heroTitle"></div>
    <div class="intro-sub" data-i18n="heroSub"></div>
    <div class="sample-cards" id="sampleCards"></div>
    <div class="cta-block">
      <button class="btn-enter btn-enter-diner" onclick="goScreen('screenDiner')" data-i18n="browseCta"></button>
      <div class="own-restaurant">
        <button onclick="goScreen('screenGate');showStep('stepDiner')" data-i18n="ownRestaurant"></button>
      </div>
    </div>
  </div>
</div>

<!-- DINER FEED -->
<div class="screen" id="screenDiner">
  <div class="inner">
    <div class="eyebrow" data-i18n="tonightEyebrow"></div>
    <div class="page-title" data-i18n="feedTitle"></div>
    <div class="page-sub" data-i18n="feedSub"></div>
    <div class="filters" id="favFilterRow"></div>
    <div class="filters" id="townFilters"></div>
    <div class="filters" id="slotFilters"></div>
    <div class="feed-meta">

  el.innerHTML=`<option value="">${placeholder}</option>`+arr.map((a,i)=>`<option value="${id==='pSlot'?i:a}">${a}</option>`).join('');
  if(prev>0) el.selectedIndex=prev;
}

/* ══════════ NAV ══════════ */
function goScreen(id,push=true){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(push){
    navStack.push(id);
    // Mirrors the in-app screen stack into the browser's REAL history (the earlier
    // "history" array shadowed the actual window.history object under the same
    // name, so the phone/browser's own back button was never hooked up to it at
    // all — see the popstate listener in the INIT section below).
    window.history.pushState({navDepth:navStack.length}, '', location.href);
  }
  document.getElementById('navBack').style.display=id==='screenIntro'?'none':'block';
  document.getElementById('navLogin').style.display=id==='screenDiner'?'block':'none';
  window.scrollTo(0,0);
  if(id==='screenDiner'){buildFilters();loadFeed();}
  if(id==='screenFavorites'){loadFavoritesScreen();}
}
function goBack(){
  // The sign-in/sign-up screen holds several steps (diner and restaurant, login and
  // signup) that don't each get their own history entry, so popping the generic
  // history stack from here can land on a stale, unrelated step. Simplest fix:
  // leaving that screen always goes back to the "what's on tonight" landing page.
  if(document.querySelector('.screen.active')?.id==='screenGate'){
    navStack=['screenIntro'];
    goScreen('screenIntro',false);
    return;
  }
  if(navStack.length>1){navStack.pop();goScreen(navStack[navStack.length-1],false);}
}

/* ══════════ FILTERS ══════════ */
function buildFilters(){
  const fw=document.getElementById('favFilterRow'); fw.innerHTML='';
  if(currentDiner){
    fw.style.display='flex';
    addChip(fw,'♥ '+t('myFavorites'),showFavoritesOnly,()=>{showFavoritesOnly=!showFavoritesOnly;buildFilters();loadFeed();});
  } else {
    fw.style.display='none';
  }
  const tw=document.getElementById('townFilters'); tw.innerHTML='';
  addChip(tw,t('allTowns'),selTowns.size===0,()=>{selTowns.clear();buildFilters();loadFeed();});
  TOWNS.forEach(x=>addChip(tw,x,selTowns.has(x),()=>{selTowns.has(x)?selTowns.delete(x):selTowns.add(x);buildFilters();loadFeed();}));
  const sw=document.getElementById('slotFilters'); sw.innerHTML='';
  addChip(sw,t('allTimes'),selSlots.size===0,()=>{selSlots.clear();buildFilters();loadFeed();});
  t('slots').forEach((x,i)=>addChip(sw,x,selSlots.has(i),()=>{selSlots.has(i)?selSlots.delete(i):selSlots.add(i);buildFilters();loadFeed();}));
}
function addChip(parent,label,active,fn){
  const b=document.createElement('button');
  b.className='filter-btn'+(active?' active':'');
  b.textContent=label; b.onclick=fn; parent.appendChild(b);
}

/* ══════════ FEED (reads live specials from Supabase) ══════════ */
function ago(dateStr){
  const mins=Math.max(0,Math.round((Date.now()-new Date(dateStr).getTime())/60000));
  if(mins<1) return t('justNow');
  if(mins<60) return mins+'m';
  const h=Math.round(mins/60);
  if(h<24) return h+'h';
  return Math.round(h/24)+'d';
}
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
// A special "expires" at its own until_time on the same calendar day it was posted —
// e.g. posted this morning with "until" set to 2:00 PM disappears once the clock
// passes 2:00 PM today. Specials with no until_time never auto-hide.
function isExpired(untilTime, createdAt){
  if(!untilTime) return false;
  const created = new Date(createdAt);
  const [h,m] = untilTime.split(':').map(Number);
  const expiry = new Date(created.getFullYear(), created.getMonth(), created.getDate(), h, m, 0, 0);
  return new Date() > expiry;
}

function initialsFor(name,email){

    return (first+last).toUpperCase();
  }
  return (email||'?').slice(0,2).toUpperCase();
}

async function submitDinerSignup(){
  const name = document.getElementById('dsName').value.trim();
  const town = document.getElementById('dsTown').value;
  const email = document.getElementById('dsEmail').value.trim();
  const password = document.getElementById('dsPassword').value;
  const password2 = document.getElementById('dsPassword2').value;
  const st = document.getElementById('dinerSignupStatus');
  if(!name || !town || !email || !email.includes('@') || !password){ st.textContent=t('fillAll'); st.className='status-msg err'; return; }
  if(password.length<6){ st.textContent=t('passwordTooShort'); st.className='status-msg err'; return; }
  if(password!==password2){ st.textContent=t('passwordMismatch'); st.className='status-msg err'; return; }
  if(!sbReady()){ st.textContent=t('loadError'); st.className='status-msg err'; return; }
  st.textContent=t('checking'); st.className='status-msg';
  const {data:signUpData, error} = await sb.auth.signUp({email, password, options:{data:{name, town}}});
  if(error){ console.error(error); st.textContent=t('loadError'); st.className='status-msg err'; return; }
  // Supabase signUp() doesn't return an error for an email that's already registered — it
  // silently returns a user object with an empty identities array instead of creating a new
  // account. Without this check, a mistyped/existing email would show a false "account created".
  if(signUpData?.user && Array.isArray(signUpData.user.identities) && signUpData.user.identities.length===0){
    st.textContent=t('emailInUse'); st.className='status-msg err'; return;
  }
  await sb.auth.signOut();
  st.textContent='';
  showStep('stepDinerWelcome');
}

/* ══════════ RESTAURANT MENU (manual edit + photo scan via OCR) ══════════ */
function menuToText(menu){
  return Object.entries(menu||{}).map(([cat,items])=>[cat, ...(items||[])].join('\n')).join('\n\n');
}
function parseMenuText(text){
  const menu = {};
  let currentCat = null;
  const lines = text.split('\n').map(l=>l.trim());
  for(const raw of lines){
    if(!raw) continue;
    let line = raw.replace(/\s+[-–—]\s+/g, ' — ');
    let isItem = line.includes(' — ');
    if(!isItem){
      const m = line.match(/^(.*?)\s+(\$?\d+(?:\.\d{2})?)$/);
      if(m && currentCat){ line = `${m[1].trim()} — ${m[2].trim()}`; isItem = true; }
    }
    if(isItem && currentCat){
      menu[currentCat] = menu[currentCat] || [];
      menu[currentCat].push(line);
    } else {
      currentCat = line.replace(/:$/,'').trim();
      menu[currentCat] = menu[currentCat] || [];
    }
  }
  Object.keys(menu).forEach(k=>{ if(!menu[k].length) delete menu[k]; });
  return menu;
}
function loadMenuForm(){
  document.getElementById('menuText').value = menuToText(currentRestaurant.menu);
}
let tesseractLoadPromise = null;
function ensureTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tesseractLoadPromise) return tesseractLoadPromise;
  tesseractLoadPromise = new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = resolve;
    s.onerror = ()=>{ tesseractLoadPromise=null; reject(new Error('tesseract load failed')); };
    document.head.appendChild(s);
  });
  return tesseractLoadPromise;
}
async function handleMenuScan(e){
  const files = Array.from(e.target.files||[]);
  if(!files.length) return;
  const st = document.getElementById('menuScanStatus');
  st.textContent = t('scanningMenu');
  try{
    await ensureTesseract();
    const chunks = [];
    for(let i=0;i<files.length;i++){
      st.textContent = t('scanningMenu')+' ('+(i+1)+'/'+files.length+')';
      const {data} = await Tesseract.recognize(files[i], 'eng');
      chunks.push((data.text||'').trim());
    }
    const ta = document.getElementById('menuText');
    const combined = chunks.filter(Boolean).join('\n\n');
    ta.value = ta.value.trim() ? ta.value.trim()+'\n\n'+combined : combined;
    st.textContent = t('scanDone');
    setTimeout(()=>{ if(st.textContent===t('scanDone')) st.textContent=''; },3000);
  }catch(err){
    console.error(err);
    st.textContent = t('loadError');
  }
  e.target.value = '';
}
async function saveMenu(){
  const menu = parseMenuText(document.getElementById('menuText').value);
  const st = document.getElementById('menuStatus');
  if(!sbReady()){ st.textContent=t('loadError'); st.className='status-msg err'; return; }
  st.textContent=t('checking'); st.className='status-msg';
  const {error} = await sb.from('restaurants').update({menu}).eq('id', currentRestaurant.id);
  if(error){ console.error(error); st.textContent=t('loadError'); st.className='status-msg err'; return; }
  currentRestaurant.menu = menu;
  st.textContent=t('menuSaved'); st.className='status-msg';
  setTimeout(()=>{st.textContent='';},3000);
}

/* ══════════ RESTAURANT PROFILE (hours/phone/location/photos) ══════════ */
let dpPhotos=[]; // {url:string|null, file:File|null, preview:string}
// Formats a 24h "HH:MM" time value as a display string like "9:00 AM".
function formatTime12(hhmm){
  if(!hhmm) return '';
  const [h,m] = hhmm.split(':').map(Number);
  const period = h>=12 ? 'PM' : 'AM';
  const h12 = h%12===0 ? 12 : h%12;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}
// Best-effort parse of a previously free-typed hours string (e.g. "9am - 10pm" or
// "9:00 AM – 10:00 PM") back into two 24h "HH:MM" values for the time pickers.
// Returns {open:'', close:''} if it can't confidently find two times.
function parseHoursToTimes(hoursStr){
  const times = [...(hoursStr||'').matchAll(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/gi)];
  if(times.length<2) return {open:'',close:''};
  const to24 = (m)=>{
    let h=+m[1], min=m[2]?+m[2]:0, period=(m[3]||'').toLowerCase();
    if(period==='pm' && h!==12) h+=12;
    if(period==='am' && h===12) h=0;
    if(h>23||min>59) return null;
    return `${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
  };
  const open=to24(times[0]), close=to24(times[1]);
  return {open: open||'', close: close||''};
}
function loadProfileForm(){
  const parsed = parseHoursToTimes(currentRestaurant.hours);
  document.getElementById('dpHoursOpen').value = parsed.open;
  document.getElementById('dpHoursClose').value = parsed.close;
  document.getElementById('dpPhone').value = currentRestaurant.phone || '';
  document.getElementById('dpAddress').value = currentRestaurant.address || '';
  dpPhotos = (currentRestaurant.photos||[]).map(url=>({url, file:null, preview:url}));
  renderProfilePhotoGrid();
}
function handleProfilePhoto(e){
  const files = Array.from(e.target.files||[]);
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = ev => { dpPhotos.push({url:null, file, preview:ev.target.result}); renderProfilePhotoGrid(); };
    reader.readAsDataURL(file);
  });
  e.target.value='';
}
function renderProfilePhotoGrid(){
  const el = document.getElementById('dpPhotoGrid');
  el.innerHTML = dpPhotos.map((p,i)=>
    `<div class="thumb-wrap"><img src="${p.preview}" alt=""><button class="thumb-x" onclick="removeProfilePhoto(${i})">✕</button></div>`
  ).join('');
}
function removeProfilePhoto(i){ dpPhotos.splice(i,1); renderProfilePhotoGrid(); }
async function saveProfile(){
  const hoursOpen=document.getElementById('dpHoursOpen').value;
  const hoursClose=document.getElementById('dpHoursClose').value;
  const hours = (hoursOpen && hoursClose) ? `${formatTime12(hoursOpen)} – ${formatTime12(hoursClose)}` : '';
  const phone=document.getElementById('dpPhone').value.trim();
  const address=document.getElementById('dpAddress').value.trim();
  const st=document.getElementById('profileStatus');
  if(!sbReady()){ st.textContent=t('loadError'); st.className='status-msg err'; return; }
  st.textContent=t('checking'); st.className='status-msg';
  const finalPhotos=[];
  for(const p of dpPhotos){
    if(p.url){ finalPhotos.push(p.url); continue; }
    const path = `${currentRestaurant.id}/profile-${Date.now()}-${p.file.name}`;
    const {error:upErr} = await sb.storage.from('specials-photos').upload(path, p.file);
    if(upErr){ console.error(upErr); st.textContent=t('loadError'); st.className='status-msg err'; return; }
    const {data} = sb.storage.from('specials-photos').getPublicUrl(path);
    if(data?.publicUrl) finalPhotos.push(data.publicUrl);
  }
  const {error} = await sb.from('restaurants').update({hours, phone, address, photos: finalPhotos}).eq('id', currentRestaurant.id);
  if(error){ console.error(error); st.textContent=t('loadError'); st.className='status-msg err'; return; }
  currentRestaurant.hours=hours; currentRestaurant.phone=phone; currentRestaurant.address=address; currentRestaurant.photos=finalPhotos;
  dpPhotos = finalPhotos.map(url=>({url, file:null, preview:url}));
  renderProfilePhotoGrid();
  st.textContent=t('profileSaved'); st.className='status-msg';
  setTimeout(()=>{st.textContent='';},3000);
}
function updatePreview(){
  const txt=document.getElementById('pText').value;
  const si=document.getElementById('pSlot').value;
  const pv=document.getElementById('pvText');
  pv.textContent=txt||t('previewPlaceholder');
  pv.style.fontStyle=txt?'normal':'italic';
  pv.style.color=txt?'var(--ink)':'var(--muted)';
  document.getElementById('pvSlot').textContent=(si!==''?slotLabel(+si):slotLabel(2))+' · '+(currentRestaurant?.town||'');
  document.getElementById('pvPhoto').innerHTML = pendingPhoto
    ? `<img class="pc-photo" src="${pendingPhoto}" alt="">` : '';
  const untilTime=document.getElementById('pUntil').value;
  const until=formatTime12(untilTime);
  document.getElementById('pvMeta').innerHTML =
    `<span>${t('justNow')}</span>${until?`<span>${esc(until)}</span>`:''}`;
}
async function postSpecial(){
  const txt=document.getElementById('pText').value.trim();
  const si=document.getElementById('pSlot').value;
  const untilTime=document.getElementById('pUntil').value;
  const until=formatTime12(untilTime);
  const st=document.getElementById('postStatus');
  if(!txt){st.textContent=t('writeFirst');st.className='status-msg err';return;}
  if(si===''){st.textContent=t('selectSlot');st.className='status-msg err';return;}
  if(!sbReady()){st.textContent=t('loadError');st.className='status-msg err';return;}
  st.textContent=t('posting'); st.className='status-msg';
  let photoUrl=null;
  if(pendingPhotoFile){ photoUrl=await uploadPendingPhoto(); }
  const {error} = await sb.from('specials').insert({
    restaurant_id: currentRestaurant.id, slot:+si, text:txt, until, until_time: untilTime||null, photo_url:photoUrl
  });
  if(error){ console.error(error); st.textContent=t('loadError'); st.className='status-msg err'; return; }
  document.getElementById('pText').value='';document.getElementById('pSlot').value='';document.getElementById('pUntil').value='';
  clearPhoto();
  updatePreview();
  st.textContent=t('posted');st.className='status-msg';
  await loadPosted();
  setTimeout(()=>{st.textContent='';},3000);
}
async function loadPosted(){
  const el=document.getElementById('postedList');
  const {data,error} = await sb.from('specials').select('*').eq('restaurant_id',currentRestaurant.id).order('created_at',{ascending:false});
  if(error){ console.error(error); el.innerHTML=`<p style="font-size:13px;color:var(--muted);margin-top:16px;">${t('loadError')}</p>`; return; }
  const mine=(data||[]).filter(p=>!isExpired(p.until_time,p.created_at));
  if(!mine.length){
    el.innerHTML=`<p style="font-size:13px;color:var(--muted);margin-top:16px;">${t('noSpecials')}</p>`;
    return;
  }
  el.innerHTML=`<div class="eyebrow" style="margin-top:24px;margin-bottom:12px;">${t('yourSpecials')}</div>`+
    mine.map(p=>`<div class="posted-item"><div><div class="pi-slot">${slotLabel(p.slot)} · ${ago(p.created_at)}</div>
    <div class="pi-text">${esc(p.text)}</div></div>
    <button class="delete-btn" onclick="delPost('${p.id}')">${t('remove')}</button></div>`).join('');
}
async function delPost(id){
  const {error} = await sb.from('specials').delete().eq('id',id);
  if(error){ console.error(error); return; }
  await loadPosted();
}
async function signOut(){
  if(sbReady()) await sb.auth.signOut();
  currentRestaurant=null; currentDiner=null; favoritesSet=new Set(); showFavoritesOnly=false;
  refreshNavLogin();
  goScreen('screenIntro'); navStack=['screenIntro'];
}

/* ══════════ INIT ══════════ */
setLang(lang);
// The in-app ← arrow (above) triggers this indirectly too, via window.history.back()
// — routing both the phone/browser's own back button and the in-app arrow through
// this single popstate handler keeps them perfectly in sync, so there's exactly one
// place that decides what "back" means. Before this, the app tracked its own screen
// stack completely separately from the real browser history, so the very first tap
// of the phone/browser's actual back button exited Dock Talk immediately. Only once
// navStack is back down to the intro screen does a further back press fall through
// to the browser's real, default back behavior (actually leaving the site).
window.addEventListener('popstate', goBack);
// Re-checks every minute for specials whose "valid until" time has passed, so a
// tile disappears from the feed (and from the restaurant's own list) on its own
// without needing a page refresh.
setInterval(()=>{
  if(document.getElementById('screenDiner')?.classList.contains('active')) loadFeed();
  const postTab=document.getElementById('dashTabPost');
  if(postTab && !postTab.hidden) loadPosted();
}, 60000);
if(sbReady()){
  sb.auth.getSession().then(({data})=>handleSession(data.session));
  sb.auth.onAuthStateChange((event, session)=>{ if(session) handleSession(session); });
} else {
  console.warn('Dock Talk: Supabase is not configured yet. Set SUPABASE_URL and SUPABASE_ANON_KEY at the top of the <script> block.');
}
